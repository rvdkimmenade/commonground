name: Nieuws bijwerken
on:
  schedule:
    - cron: '0 5-18/3 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/fetch-news.mjs
      - name: Commit als er iets veranderd is
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/news.json
          git diff --cached --quiet || (git commit -m "Nieuws bijgewerkt" && git push)
