<g class="g" text-anchor="middle" dominant-baseline="central">
<rect x="40" y="280" width="380" height="72" rx="6" stroke-width="0.5"/><text class="th" x="230" y="300">Suwinet (beheer BKWI, onderdeel UWV)</text><text class="ts" x="230" y="320">BRP · BRK · BRV · BRI · UWV · SVB · DUO · bijstand</text><text class="ts" x="230" y="338">Geautoriseerd per rol, gelogd</text>
<rect x="440" y="280" width="200" height="72" rx="6" stroke-width="0.5"/><text class="th" x="540" y="300">Directe koppelingen</text><text class="ts" x="540" y="320">Haal Centraal BRP · LV BAG</text><text class="ts" x="540" y="338">Kadaster BRK · KvK HR</text>
<rect x="40" y="390" width="380" height="56" rx="6" stroke-width="0.5"/><text class="th" x="230" y="408">DKD (Digitaal Klantdossier)</text><text class="ts" x="230" y="428">Per BSN: Inkijk (scherm) · Inlezen (SOAP-API)</text>
<rect x="440" y="390" width="200" height="56" rx="6" stroke-width="0.5"/><text class="th" x="540" y="408">Gemeentelijke systemen</text><text class="ts" x="540" y="428">Zaaksysteem · Wmo · BI</text>
</g>
<g class="c" text-anchor="middle" dominant-baseline="central">
<rect x="40" y="484" width="600" height="72" rx="8" stroke-width="0.5"/><text class="th" x="340" y="504">Gemeente als afnemer</text><text class="ts" x="340" y="524">Werk en inkomen · schuldhulp · Wmo · handhaving</text><text class="ts" x="340" y="542">Toegang alleen per wettelijke taak (doelbinding, DPIA)</text>
</g>
<g class="p"><rect x="40" y="580" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts l" x="58" y="590">Basisregistratie</text>
<g class="t"><rect x="180" y="580" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts l" x="198" y="590">Sectorale bron</text>
<g class="g"><rect x="310" y="580" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts l" x="328" y="590">Ontsluiting/product</text>
<g class="c"><rect x="470" y="580" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts l" x="488" y="590">Gemeente (afnemer)</text>
</svg>
