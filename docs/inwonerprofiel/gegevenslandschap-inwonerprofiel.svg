<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="915" viewBox="0 0 680 610" role="img" font-family="Segoe UI, Arial, sans-serif">
<title>Gegevenslandschap inwonerprofiel gemeente</title>
<desc>Bronregisters met leveranciers, ontsluiting via Suwinet of directe koppelingen, DKD en gemeentelijke systemen, gemeente als afnemer onder doelbinding.</desc>
<style>
.th{font-size:14px;font-weight:600}.ts{font-size:12px}
.p rect{fill:#EEEDFE;stroke:#534AB7}.p .th{fill:#3C3489}.p .ts{fill:#534AB7}
.t rect{fill:#E1F5EE;stroke:#0F6E56}.t .th{fill:#085041}.t .ts{fill:#0F6E56}
.g rect{fill:#F1EFE8;stroke:#5F5E5A}.g .th{fill:#444441}.g .ts{fill:#5F5E5A}
.c rect{fill:#FAECE7;stroke:#993C1D}.c .th{fill:#712B13}.c .ts{fill:#993C1D}
.l{fill:#5F5E5A}.a{stroke:#5F5E5A;stroke-width:1.5}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5"/></marker></defs>
<rect width="680" height="610" fill="#FFFFFF"/>
<rect x="22" y="20" width="636" height="222" rx="12" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="ts l" x="34" y="40">Basisregistraties (register · inhoud · bronhouder/leverancier)</text>
<g class="p" text-anchor="middle" dominant-baseline="central">
<rect x="30" y="50" width="100" height="68" rx="6" stroke-width="0.5"/><text class="th" x="80" y="68">BRP</text><text class="ts" x="80" y="86">Personen</text><text class="ts" x="80" y="104">Gemeente</text>
<rect x="134" y="50" width="100" height="68" rx="6" stroke-width="0.5"/><text class="th" x="184" y="68">BAG</text><text class="ts" x="184" y="86">Adressen</text><text class="ts" x="184" y="104">Gemeente</text>
<rect x="238" y="50" width="100" height="68" rx="6" stroke-width="0.5"/><text class="th" x="288" y="68">BRK</text><text class="ts" x="288" y="86">Eigendom</text><text class="ts" x="288" y="104">Kadaster</text>
<rect x="342" y="50" width="100" height="68" rx="6" stroke-width="0.5"/><text class="th" x="392" y="68">HR</text><text class="ts" x="392" y="86">Ondernemingen</text><text class="ts" x="392" y="104">KvK</text>
<rect x="446" y="50" width="100" height="68" rx="6" stroke-width="0.5"/><text class="th" x="496" y="68">BRV</text><text class="ts" x="496" y="86">Voertuigen</text><text class="ts" x="496" y="104">RDW</text>
<rect x="550" y="50" width="100" height="68" rx="6" stroke-width="0.5"/><text class="th" x="600" y="68">BRI</text><text class="ts" x="600" y="86">Inkomen</text><text class="ts" x="600" y="104">Belastingdienst</text>
</g>
<text class="ts l" x="340" y="138" text-anchor="middle">Sleutels: BSN · BAG-id · kadastraal perceel · KvK-nummer · kenteken</text>
<text class="ts l" x="34" y="162">Sectorale registraties (leverancier · inhoud)</text>
<g class="t" text-anchor="middle" dominant-baseline="central">
<rect x="40" y="170" width="140" height="56" rx="6" stroke-width="0.5"/><text class="th" x="110" y="188">UWV</text><text class="ts" x="110" y="208">Polis · WW · WIA</text>
<rect x="193" y="170" width="140" height="56" rx="6" stroke-width="0.5"/><text class="th" x="263" y="188">SVB</text><text class="ts" x="263" y="208">AOW · Anw · KB</text>
<rect x="346" y="170" width="140" height="56" rx="6" stroke-width="0.5"/><text class="th" x="416" y="188">DUO</text><text class="ts" x="416" y="208">Studiefinanciering</text>
<rect x="499" y="170" width="140" height="56" rx="6" stroke-width="0.5"/><text class="th" x="569" y="188">Gemeente</text><text class="ts" x="569" y="208">Bijstand via BIDN</text>
</g>
<g class="a" marker-end="url(#arrow)">
<line x1="230" y1="242" x2="230" y2="278"/><line x1="540" y1="242" x2="540" y2="278"/>
<line x1="230" y1="352" x2="230" y2="388"/><line x1="540" y1="352" x2="540" y2="388"/>
<line x1="230" y1="446" x2="230" y2="482"/><line x1="540" y1="446" x2="540" y2="482"/>
